plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

version = '1.0.0-alpha'
group = 'com.worldtransitai.mod'

base {
    archivesName = 'worldtransitai-forge-1.21.1'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft {
    mappings channel: 'official', version: '1.21.1'
    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                worldtransitai {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                worldtransitai {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.blamejared.com' }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.21.1-52.0.16'
    // Gson is bundled with Minecraft, used for OpenStreetMap / AI API responses
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: '1.21.1',
            minecraft_version_range: '[1.21.1,1.22)',
            forge_version: '52.0.16',
            forge_version_range: '[52,)',
            loader_version_range: '[52,)',
            mod_id: 'worldtransitai',
            mod_name: 'World Transit AI: Global Transport & Microblocks',
            mod_license: 'MIT',
            mod_version: '1.0.0-alpha',
            mod_authors: 'Gemini & Creator'
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}
